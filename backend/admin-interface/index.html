<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin panel</title>
  <script>
    // --------------------------------------------------- INPUT API URL HERE ---------------------------------------------------
    var apiUrl = "";

    if (apiUrl.endsWith("/")) {
      apiUrl = apiUrl.slice(0, -1);
    }
  </script>
</head>
<body>

  <button id="logoutBtn">Log out</button><br/><br/>
  
  <form>
    Login, email or phone number: <input type="tel" id="loginPhoneNumber" name="phoneNumber"/><br/>
    Password: <input type="password" id="loginPassword" name="password"/><br/>
    <button id="loginBtn">Log in</button>
  </form>
  <script>
    document.getElementById("loginBtn").addEventListener("click", (event) => {
      event.preventDefault();
      const phoneNumber = document.getElementById("loginPhoneNumber").value;
      const password = document.getElementById("loginPassword").value;

      fetch(apiUrl + "/auth/login", {
        method: "POST",
        credentials: "include",
        body: JSON.stringify({ phoneNumber, password }),
        headers: {
          "Content-Type": "application/json"
        }
      })
      .then((res) => {
        if (res.status === 200) {
          alert("Logged in successfully");
          window.location.reload();
        } else if (res.status === 403) {
          alert("Invalid credentials");
        } else if (res.status === 429) {
          alert("Too many login attempts - please wait and try again");
        } else {
          alert("Error logging in\n" + JSON.stringify(res));
        }
      });
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      fetch(apiUrl + "/auth/logout", {
        method: "POST",
        credentials: "include"
      })
      .then((res) => {
        if (res.status >= 200 && res.status < 400) {
          alert(`Logged out successfully (status: ${res.status})`);
          window.location.reload();
        } else {
          alert("Error logging out. Clear the browser cookies.\n" + JSON.stringify(res));
        }
      });
    });
  </script>
  
  
  <hr>

  <h1>Activate a user account:</h1>
  Input account ID (please be careful!): <input type="text" id="accountId"/><br/>
  <button id="activateBtn">Activate account</button>

  <script>
    document.getElementById("activateBtn").addEventListener("click", () => {
      let answer = confirm("Are you sure you want to activate this account?");
      if (!answer) return;

      const accountId = document.getElementById("accountId").value;
      fetch(apiUrl + `/accounts/${accountId}/activated/`, {
        method: "PATCH",
        credentials: "include",
        body: JSON.stringify({ activated: true }),
        headers: {
          "Content-Type": "application/json"
        }
      })
      .then((res) => {
        if (res.status === 200) {
          alert("Account activated successfully");
          window.location.reload();
        } else if (res.status === 401) {
          alert("Unauthorized - please log in using the admin account");
        } else if (res.status === 403) {
          alert("Forbidden - please log in using the admin account");
        } else if (res.status === 404) {
          alert("Account not found");
        } else {
          alert("Error activating account");
        }
      });
    });
  </script>

  <hr>

  <h1>Search profiles:</h1>
  Search by name or phone number: <input type="text" id="profileSearchQuery"/><br/>
  <button id="searchProfilesBtn">Search profiles</button>
  <div id="searchProfilesStatus"></div>
  <ul id="searchResults"></ul>

  <script>
    document.getElementById("searchProfilesBtn").addEventListener("click", (event) => {
      event.preventDefault();

      const query = document.getElementById("profileSearchQuery").value.trim();
      const status = document.getElementById("searchProfilesStatus");
      const results = document.getElementById("searchResults");
      status.textContent = "";
      results.innerHTML = "";

      if (!query) {
        status.textContent = "Enter a name or phone number first.";
        return;
      }

      fetch(apiUrl + `/profiles/search?q=${encodeURIComponent(query)}`, { credentials: "include" })
        .then(async (res) => {
          if (!res.ok) {
            const message = res.status === 401
              ? "Unauthorized - please log in using the admin account"
              : res.status === 403
                ? "Forbidden - please log in using the admin account"
                : res.status === 429
                  ? "Too many search requests - please wait and try again"
                  : "Error searching profiles";
            throw new Error(message);
          }
          return res.json();
        })
        .then((profiles) => {
          if (!Array.isArray(profiles) || profiles.length === 0) {
            status.textContent = "No profiles found.";
            return;
          }

          status.textContent = `Found ${profiles.length} profile(s).`;
          profiles.forEach((profile) => {
            const item = document.createElement("li");
            item.textContent = `ID: ${profile.id} | Name: ${profile.name ?? "-"} | Phone: ${profile.phoneNumber ?? "-"}`;
            results.appendChild(item);
          });
        })
        .catch((error) => {
          status.textContent = error.message;
        });
    });
  </script>

  <hr>

  <h1>Change a user password:</h1>
  User ID: <input type="text" id="passwordUserId"/><br/>
  Admin password: <input type="password" id="adminPassword"/><br/>
  New password: <input type="password" id="newPassword"/><br/>
  <button id="changePasswordBtn">Change password</button>
  <div id="changePasswordStatus"></div>

  <script>
    document.getElementById("changePasswordBtn").addEventListener("click", (event) => {
      event.preventDefault();

      const userId = document.getElementById("passwordUserId").value.trim();
      const adminPassword = document.getElementById("adminPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const status = document.getElementById("changePasswordStatus");
      status.textContent = "";

      if (!userId) {
        status.textContent = "Enter a user ID first.";
        return;
      }

      fetch(apiUrl + `/accounts/${encodeURIComponent(userId)}/password`, {
        method: "PATCH",
        credentials: "include",
        body: JSON.stringify({ adminPassword, newPassword }),
        headers: {
          "Content-Type": "application/json"
        }
      })
      .then((res) => {
        if (res.status === 200 || res.status === 204) {
          status.textContent = "Password changed successfully.";
          return;
        }

        if (res.status === 401) {
          throw new Error("Unauthorized - please log in using the admin account");
        }
        if (res.status === 403) {
          throw new Error("Forbidden - invalid credentials or non-admin account");
        }
        if (res.status === 404) {
          throw new Error("Account not found");
        }

        throw new Error("Error changing password");
      })
      .catch((error) => {
        status.textContent = error.message;
      });
    });
  </script>

  <hr>

  <h1>Unactivated accounts list:</h1>
  <ul id="list"></ul>


  <script>
    fetch(apiUrl + "/accounts/unactivated", { credentials: "include" })
      .then((res) => res.json())
      .then((accounts) => {
        const list = document.getElementById("list");
        if (accounts.statusCode === 401) {
          list.textContent = "Unauthorized - please log in using the admin account";
          return;
        }
        if (accounts.statusCode === 403) {
          list.textContent = "Forbidden - please log in using the admin account";
          return;
        }
        accounts.forEach(a => {
          const sublist = document.createElement("ul");
          for (const key in a) {
            const item = document.createElement("li");
            item.textContent = `${key}: ${a[key]}`;
            sublist.appendChild(item);
          }
          list.appendChild(sublist);
          list.appendChild(document.createElement("hr"));
        });
      });
  </script>
</body>
</html>
