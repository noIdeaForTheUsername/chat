# Rate limiting settings at the global config file (nginx.conf)
# limit_req_zone $binary_remote_addr zone=default:10m rate=20r/s;
# limit_req_status 429;

server {
    listen 8101;
    listen [::]:8101;

    server_name chat.serwerigora.com czat.serwerigora.com;

    # Cloudflare tunnel - client IP
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;

    # Rate limiting
    limit_req zone=default burst=100 nodelay;  # the amount of requests on a normal page load is 57!


    # Security headers
    add_header Strict-Transport-Security "max-age=15552000;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; form-action 'none'; object-src 'none'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; img-src 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # Angular frontend
    root /var/www/chat/frontend/www;
    index index.html;

    # Angular frontend assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
    }

    # Angular frontend routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Backend admin panel and Android app download
    location ~ ^/(admin|android-download) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSockets
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
