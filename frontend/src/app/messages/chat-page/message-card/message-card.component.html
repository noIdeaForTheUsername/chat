@let repliedId = message().repliedId;
@let repliedText = message().repliedText;


<!-- Message -->
<div class="message-container"
[class.deleted]="deleted()"
[class.own]="message().isOwn"
[class.space-before]="spaceBefore()"
[class.selected]="selectionService().selectedIds().includes(message().globalId)"
holdDirective (hold)="showActionMenuInternal(message().globalId)"
(setClickLock)="setClickLock($event)"
(click)="toggleItemSelectionInternal(message().globalId)"
(contextmenu)="showActionMenuInternal(message().globalId, $event)">

  <!-- message metadata -->
  @if (displayMetadata()) { 
    <p class="metadata">{{profile() | visibleName}} | {{displayedDate()}}</p> 
  }

  <!-- message card -->
  <div
    [id]="'msg-' + message().globalId"
    class="message-card"
    [class.own]="message().isOwn"> 
      @if (repliedId && !deleted()) {
        <!-- response card -->
        <div class="replied-preview clickable" (click)="repliedClickInternal(repliedId)">
          <ion-icon name="arrow-redo"></ion-icon>&nbsp;
          <span>{{repliedText || '○ ○ ○'}}</span>
        </div>
      }
      <!-- message text -->
        <div class="message-text">{{deleted() ? ('page.chat.message-deleted' | translate) : (message().text)}}</div>
    </div>
</div>
