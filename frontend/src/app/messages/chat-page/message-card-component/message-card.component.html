@let repliedId = message().repliedId;
@let repliedText = message().repliedText;

@if (unreadNoteAbove()) {
  <app-chat-note [line]="true" class="red space-before" [text]="'page.chat.new-messages' | translate"/>
}

<div class="message-container"
[class.own]="message().isOwn"
[class.space-before]="spaceBefore()"
[class.selected]="selectionService().selectedIds().includes(message().globalId)"
holdDirective (hold)="showActionMenuInternal(message().globalId)"
(setClickLock)="setClickLock($event)"
(click)="toggleItemSelectionInternal(message().globalId)"
(contextmenu)="showActionMenuInternal(message().globalId, $event)">

  @if (displayMetadata()) { <ion-note>{{profile | visibleName}} | {{displayedDate()}}</ion-note> }
  <ion-card
    [id]="'msg-' + message().globalId"
    class="message-card"
    [class.own]="message().isOwn"
    [color]="color">
      @if (repliedId !== undefined && repliedText !== undefined) {
        <!-- response card -->
        <ion-card class="replied-preview" (click)="repliedClickInternal(repliedId)">
          <ion-card-content><ion-icon name="arrow-redo"></ion-icon>&nbsp;<span [innerHTML]="repliedText"></span></ion-card-content>
        </ion-card>
      }
      <!-- message text -->
      <ion-card-content class="message-text">
        {{message().text}}
      </ion-card-content>
  </ion-card>
</div>
