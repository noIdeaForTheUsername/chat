<app-standard-header [title]="'profile.register' | translate" [backButtonDefaultHref]="backButtonDefaultHref()">
  <ion-buttons slot="end">
    <app-language-button/>
  </ion-buttons>
</app-standard-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form">
  <div class="account-form-container">
    <h1>{{ 'page.register.header' | translate }}</h1>

    <a routerLink="/login">{{ "page.register.login-hint" | translate }}</a>

    <hr>

    <!-- name and phone -->

    <div class="floating-input">
      <label>
        <p class="highlighted-b" [innerHTML]="('page.register.phone-input' | translate) + ':'"></p>
        <input formControlName="phoneNumber">
      </label>
    </div>

    <div class="floating-input">
      <label>
        <p>{{ 'page.register.name-input' | translate }}:</p>
        <input formControlName="name" maxlength="40">
      </label>
    </div>

    <hr>

    <!-- password -->

    <div class="floating-input">
      <label>
        <p>{{ 'profile.password' | translate }}:</p>
        <input formControlName="password" type="password" maxlength="100">
      </label>
    </div>
    <div class="floating-input">
      <label>
        <p>{{ 'profile.password-repeat' | translate }}:</p>
        <input formControlName="passwordRepeat" type="password" maxlength="100">
      </label>
    </div> 
    <app-password-strength
      [password]="form.get('password')?.value ?? ''"
      [passwordRepeat]="form.get('passwordRepeat')?.value ?? ''"/>

    <hr>

    <!-- bio -->

    <div class="floating-input">
      <label>
        <p>{{ 'page.register.bio-input' | translate }}:</p>
        <textarea formControlName="bio" placeholder="{{ 'profile.user-bio-placeholder' | translate }}" maxlength="500"></textarea>
      </label>
    </div>

    <hr>

    <ion-button fill="solid" (click)="register()" [disabled]="this.auth.processing()">
      {{ 'profile.register' | translate }}
    </ion-button>
  </div>
  </form>
</ion-content>
