<app-standard-header [title]="'profile.register' | translate" [backButtonDefaultHref]="backButtonDefaultHref()">
  <ion-buttons slot="end">
    <app-language-button/>
  </ion-buttons>
</app-standard-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form">
  <div class="container">
    <h1>{{ 'page.register.header' | translate }}</h1>

    <a routerLink="/login">{{ "page.register.login-hint" | translate }}</a>

    <hr>

    <p class="hint" [innerHTML]="'page.register.encouragement' | translate"></p>

    <!-- name and login -->

    <div class="floating-input">
      <label>
        <p>{{ 'page.register.name-input' | translate }}:</p>
        <input formControlName="name">
      </label>
    </div>

    <div class="floating-input">
      <label>
        <p>{{ 'page.register.login-input' | translate }}:</p>
        <input formControlName="login">
      </label>
    </div>

    <hr>
    <!-- email and phone -->

    <p class="hint highlighted-b" [innerHTML]="'page.register.email-phone-hint' | translate"></p>

    <div class="floating-input">
      <label>
        <p>{{ 'page.register.email-input' | translate }}:</p>
        <input formControlName="email" type="email" placeholder="example@mail.com">
      </label>
    </div>

    <div class="floating-input">
      <label>
        <p>{{ 'page.register.phone-input' | translate }}:</p>
        <input formControlName="phoneNumber" type="tel" placeholder="+48 000 000 000">
      </label>
    </div>

    <hr>
    <!-- password -->

    <div class="floating-input">
      <label>
        <p>{{ 'profile.password' | translate }}:</p>
        <input formControlName="password" type="password">
      </label>
    </div>
    <div class="floating-input">
      <label>
        <p>{{ 'profile.password-repeat' | translate }}:</p>
        <input formControlName="passwordRepeat" type="password">
      </label>
    </div>

    <!-- <hr>
    email and phone settings

    <p>{{ 'page.register.email-phone-settings' | translate }}:</p>
    <ion-toggle alignment="center" formControlName="emailPublic">{{'profile.email' | translate }}</ion-toggle><br/>
    <ion-toggle alignment="center" formControlName="phoneNumberPublic">{{'profile.phone-number' | translate }}</ion-toggle><br/> -->
    
    <hr>
    <!-- bio -->

    <div class="floating-input">
      <label>
        <p>{{ 'page.register.bio-input' | translate }}:</p>
        <textarea formControlName="bio" placeholder="{{ 'profile.user-bio-placeholder' | translate }}"></textarea>
      </label>
    </div>

    <hr>

    <ion-button fill="solid" (click)="register()" [disabled]="this.auth.processing()">
      {{ 'profile.register' | translate }}
    </ion-button>
  </div>
  </form>
</ion-content>
