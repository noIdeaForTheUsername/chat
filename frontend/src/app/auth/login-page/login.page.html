<app-standard-header [title]="'profile.log-in' | translate">
  <ion-buttons slot="end">
    <app-language-button/>
  </ion-buttons>
</app-standard-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="loginForm">
    <div class="container">
      <h1>{{ 'page.login.header' | translate }}</h1>

      <a routerLink="/register">{{ "page.login.register-hint" | translate }}</a>

      <div class="floating-input">
        <label for="phoneNumber"><p class="highlighted-b" [innerHTML]="'page.login.phone-input' | translate"></p></label>
        <input formControlName="phoneNumber" id="phoneNumber" name="phoneNumber" type="tel" placeholder="+48 123 123 123">
      </div>
      
      <div class="floating-input">
        <label for="password"><p>{{ 'profile.password' | translate }}:</p></label>
        <input formControlName="password" id="password" name="password" type="password">
        <p>{{ 'profile.forgot-password-hint' | translate }}</p>
      </div>

      <ion-button fill="solid" (click)="login()" [disabled]="this.authService.processing()">
        {{ 'profile.log-in' | translate }}
      </ion-button>
    </div>
  </form>
</ion-content>
