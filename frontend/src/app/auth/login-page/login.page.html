<app-standard-header [title]="'profile.log-in' | translate" [backButton]="displayBackButton()">
  <ion-buttons slot="end">
    <ion-button (click)="toggleLanguage()">
      <ion-icon name="language"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-standard-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="loginForm">
    <div class="container">
      <h1>{{ 'page.login.header' | translate }}</h1>

      <a routerLink="/register">{{ "page.login.register-hint" | translate }}</a>

      <div class="floating-input">
        <label>
          <p>{{ 'page.login.account-input' | translate }}:</p>
          <input formControlName="account">
        </label>
      </div>
      
      <div class="floating-input">
        <label>
          <p>{{ 'profile.password' | translate }}:</p>
          <input formControlName="password" type="password">
        </label>
      </div>

      <ion-button fill="solid" (click)="login()" [disabled]="this.authService.processing()">
        {{ 'profile.log-in' | translate }}
      </ion-button>
    </div>
  </form>
</ion-content>
