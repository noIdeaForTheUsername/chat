@let file = this.file();

<p style="display: none;">file preview component!</p>

@if (file && file.type == "image") {
  <a [href]="file.url" download>
  <img [src]="file.url" [alt]="file.originalName" class="mediaPreview"/>
  </a>
}
@else if (file && file.type == "video") {
  <video controls class="mediaPreview">
    <source [src]="file.url">
    Your browser does not support videos.
  </video>
}
@else if (file && file.type == "downloadable") {
  <a [href]="file.url" download>
    {{ file.originalName }}
  </a>
}
