@let file = this.file();


@if (file && file.type == "image") {
  <img
    [ngSrc]="file.url"
    class="mediaPreview"
    [alt]="file.originalName"
    [width]="dimensions().width"
    [height]="dimensions().height"
    (click)="mediaClick.emit($event)"
  />
}
@else if (file && file.type == "video") {
  <div (click)="mediaClick.emit($event)"
    class="mediaPreview videoPreview" [style.width]="dimensions().width + 'px'" [style.height]="dimensions().height + 'px'">
    <ion-icon name="play-circle"></ion-icon>
  </div>
}
@else if (file && file.type == "downloadable") {
  <div class="downloadablePreview" (click)="downloadFile($event)">
    <div class="fileIcon">
      <ion-icon name="document"></ion-icon>
    </div>

    <div class="fileMeta">
      <strong>{{ file.originalName }}</strong>
      <span>{{ file.sizeInBytes | fileSize }}</span>
    </div>
  </div>
}
