@if (viewer.active()) {
	<div class="overlay">
		<button
			class="close"
			type="button"
			(click)="viewer.close()">
			✕
		</button>

		@if (viewer.files()!.length > 1) {
			<button 
				class="nav left"
				type="button"
				(click)="viewer.previous()">
				❮
			</button>
		}

		<!-- (touchstart)="touchStart($event)"
			(touchend)="touchEnd($event)"
			(touchcancel)="touchCancel()" -->

		<div
			#mediaElement
			class="content"
		>
			@if (currentFile(); as file) {
				@if (file.type === 'image') {
					<img
						[src]="file.url"
						[alt]="file.originalName">
				} @else if (file.type === 'video') {
					<video
						controls
						preload="metadata"
						[src]="file.url">
					</video>
				}
			}
		</div>

		@if (viewer.showDownloadButton()) {
			<button 
				class="download"
				(click)="viewer.download()">
				<ion-icon name="download"/>
			</button>
		}

		@if (viewer.files()!.length > 1) {
			<button
				class="nav right"
				type="button"
				(click)="viewer.next()">
				❯

			</button>
		}
	</div>
}
