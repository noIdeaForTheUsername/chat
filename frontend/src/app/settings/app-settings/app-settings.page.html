@let userId = authService.getUserId();

<app-standard-header [title]="'page.app-settings.title' | translate"/>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="max-width-container">
    <h1>{{'common.settings' | translate}}</h1>

    <!-- ACCOUNT -->
    <ion-item-group>
      <ion-item-divider><ion-label>{{"profile.account" | translate}}</ion-label></ion-item-divider>
        <!-- profile -->
        @if (userId) {
          <app-item-button [text]="'profile.my' | translate" icon="person" [routerLink]="`/profiles/${userId}`"/>
        }
        <!-- lock -->
        <!-- <app-item-button [text]="'common.lock-app' | translate" icon="lock-closed"/> -->
        <!-- auto-lock toggle -->
        <!-- <app-item-toggle [text]="'page.app-settings.auto-lock' | translate" icon="lock-closed"/> -->
        <!-- change account information -->
        <app-item-button routerLink="account" [text]="'page.app-settings.modify-account' | translate" icon="build"/>
        <!-- log out -->
        <app-item-button [text]="'page.app-settings.logout' | translate"
        icon="log-out" iconColor="danger" (click)="authService.logout()"/>
    </ion-item-group>

    <!-- APP -->
    <ion-item-group>
      <ion-item-divider><ion-label>{{"common.app" | translate}}</ion-label></ion-item-divider>
        <!-- notifications -->
        @if (notificationsService.notificationsSupported) {
        <app-item-button [text]="'common.enable-notifications' | translate" icon="notifications" (click)="requestNotifications()"/>
        }

        <!-- install app -->
        @if (!runningAsPwa() && !runningNatively()) {
          <app-item-button [text]="'page.app-settings.install-pwa' | translate" icon="download" routerLink="/installation-guide"/>
        }
        <app-item-button [text]="'page.app-settings.install-android' | translate" icon="logo-android" routerLink="/android-installation"/>

        <!-- language -->
        <app-item-select text="Language / Język" icon="language"
          [value]="languageSelectValue" (selectionChange)="onLanguageSelect($event)">
          <ion-select-option value="polish">Polski</ion-select-option>
          <ion-select-option value="english">English</ion-select-option>
        </app-item-select>
    </ion-item-group>

    <!-- DANGER ZONE -->
    <!-- <ion-item-group>
      <ion-item-divider><ion-label>{{"common.danger-zone" | translate}}</ion-label></ion-item-divider> -->
      <!-- delete all messages -->
      <!-- <app-item-button [text]="'page.app-settings.delete-messages' | translate" icon="trash" iconColor="danger"/>
    </ion-item-group> -->
  </div>
</ion-content>
