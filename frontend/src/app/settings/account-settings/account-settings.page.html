<app-standard-header [title]="'page.account-settings.title' | translate"></app-standard-header>

<ion-content [fullscreen]="true">
  @if (loading()) {
    <app-loading-indicator size="full" [errorId]="loadErr()"/>
  }
  @else {
    <form [formGroup]="form">
    <div class="account-form-container safe-bottom">
      <h1>{{ 'page.account-settings.title' | translate }}</h1>

      <hr>
      <p class="top-hint highlighted-b" [innerHTML]="'page.account-settings.hint' | translate"></p>
      <ion-note>{{ 'profile.forgot-password-hint' | translate }}</ion-note>

      <div class="floating-input">
        <label>
          <p>{{ 'page.account-settings.current-password' | translate }}:</p>
          <input formControlName="currentPassword" type="password" maxlength="100">
        </label>
      </div>

      <hr>

      <!-- phone number -->
      <div class="floating-input">
        <label>
          <p class="highlighted-b" [innerHTML]="'page.register.phone-input' | translate"></p>
          <input formControlName="phoneNumber" type="tel" placeholder="+48 000 000 000">
        </label>
      </div>

      <hr>

      <!-- password -->
      <div class="floating-input">
        <label>
          <p>{{ 'page.account-settings.new-password' | translate }}:</p>
          <input formControlName="password" type="password" maxlength="100">
        </label>
      </div>

      <div class="floating-input">
        <label>
          <p>{{ 'profile.password-repeat' | translate }}:</p>
          <input formControlName="passwordRepeat" type="password" maxlength="100">
        </label>
      </div>

      @if (form.get('password')?.value || form.get('passwordRepeat')?.value) {
        <app-password-strength
          [password]="form.get('password')?.value ?? ''"
          [passwordRepeat]="form.get('passwordRepeat')?.value ?? ''"/>
      }

      <hr>

      <ion-button fill="solid" (click)="editAccount()">
        {{ 'common.confirm' | translate }}
      </ion-button>
    </div>
  </form>
  }
</ion-content>
