<ion-item [button]="true" class="rounded" (click)="navigate()" (setClickLock)="setClickLock($event)"
  [class.unread]="conversationView().unreadMessages"
  [class.selected]="selectionService().selectedIds().includes(conversationView().id)"
  holdDirective (hold)="onConversationHold(conversationView().id)"
  (click)="onConversationClick(conversationView().id)">
  <ion-avatar aria-hidden="true" slot="start"> 
    <img src="https://ionicframework.com/docs/img/demos/avatar.svg"/>
  </ion-avatar>

  <!-- CONVERSATION INFO -->
  <ion-label class="ion-text-nowrap">
    <h2>{{ this.profile() | visibleName: true }}</h2>
    <p>{{conversationView().lastMessageText || "• • •"}}</p>  <!--the dots look nice and prevent the list elements from suddenly changing their heights after loading-->
  </ion-label>
  @if (conversationView().unreadMessages) { <ion-icon name="ellipse" slot="end" color="primary"></ion-icon> }
</ion-item>
