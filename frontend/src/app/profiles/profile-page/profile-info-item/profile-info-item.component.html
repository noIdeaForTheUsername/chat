@if (!hidden()) {
  <ion-item lines="full" [class.unset]="false" [class.editable]="editable()">

    <!-- TITLE -->
    <ion-label class="title">
      <span>{{title()}}</span>
      @if (infoBox()) {
        <ion-icon name="help-circle" size="large" class="clickable" (click)="displayInfoBox()"></ion-icon>
      }
    </ion-label>

    <!-- VALUE -->
    @if (editable()) {
      <ion-input
        [type]="type()"
        class="editable"
        [placeholder]="'common.empty' | translate"
        [value]="value()"
        (ionChange)="onValueChange($event.target.value)">
        <ion-icon name="pencil" class="edit-icon" slot="end"/>
      </ion-input>
    }
    @else {
      <ion-label slot="end" class="selectable">{{valueDisplay()}}</ion-label>
    }
  </ion-item>
}
